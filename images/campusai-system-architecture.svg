<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">CampusAI · 系统架构总览</title><desc id="desc">Vue 用户端和若依管理端分别连接 AI 服务与业务管理服务。公告与资料变更通过 RabbitMQ 发送。基础能力包括 MySQL、Redis Stack、MinIO 与模型服务。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcebe8"/><stop offset=".6" stop-color="#e9f1f2"/><stop offset="1" stop-color="#c3d7e5"/></linearGradient><radialGradient id="glow"><stop stop-color="#a3edd5" stop-opacity=".19"/><stop offset="1" stop-color="#a3edd5" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163c43" flood-opacity=".1"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M2 2L7 5L2 8" fill="none" stroke="#0f5257" stroke-width="1.3"/></marker></defs><g font-family="Geist, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><g data-layer="background" data-at="0" data-style="none"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#edf3f3" stroke="none"/><rect x="0" y="0" width="1600" height="208" rx="0" fill="#102d31" stroke="none"/><g transform="translate(58 35)"><rect x="0" y="0" width="34" height="34" rx="10.2" fill="#a3edd5" stroke="none"/><path d="M23.459999999999997 9.86H14.62Q8.84 9.86 8.84 16.66Q8.84 24.14 14.62 24.14H23.459999999999997" stroke="#102d31" stroke-width="2.3800000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="23.799999999999997" cy="17.34" r="1.598" fill="#102d31"/></g><text x="108" y="59" font-size="17" fill="#a3edd5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">CAMPUSAI / ARCHITECTURE</text><text x="58" y="124" font-size="43" fill="white" font-weight="500" >一个园区平台，两条服务链路。</text><text x="60" y="172" font-size="21" fill="#b2cbcd" font-weight="400" >业务管理与 AI 服务分工，借助消息队列连接公告、资料与知识检索。</text><text x="1540" y="62" font-size="15" fill="#a3bfc1" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">01 / SYSTEM DESIGN</text><path d="M58 941L1542 941" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="58" y="973" font-size="14" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">JOYCE YU  /  CAMPUSAI</text><text x="1542" y="973" font-size="14" fill="#5f7679" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">SPRING AI · RAG · TOOL CALLING</text></g><g data-layer="entry" data-at="0.3" data-style="up"><rect x="58" y="240" width="1484" height="83" rx="17" fill="white" stroke="#d6e2e2"/><text x="82" y="273" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">ENTRY</text><g transform="translate(236 266) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4H21V17H10L5 21V17H3Z"/></g><text x="274" y="288" font-size="23" fill="#152f33" font-weight="500" >Vue 用户端</text><text x="490" y="287" font-size="20" fill="#5f7679" font-weight="400" >智能客服 / AI 对话 / PDF 问答</text><path d="M954 261L954 303" stroke="#d6e2e2" stroke-width="1" fill="none" /><g transform="translate(1000 266) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7L12 2L22 7L12 12ZM2 12L12 17L22 12M2 17L12 22L22 17"/></g><text x="1038" y="288" font-size="23" fill="#152f33" font-weight="500" >若依管理端</text><text x="1240" y="287" font-size="20" fill="#5f7679" font-weight="400" >公告 / 资料 / 报名</text></g><g data-layer="connections" data-at="0.65" data-style="up"><path d="M430 323V364M1170 323V364" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g><