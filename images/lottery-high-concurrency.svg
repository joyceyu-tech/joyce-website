  <text x="80" y="141" fill="#342C2A" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="700">高并发抽奖处理链路</text><text x="82" y="177" fill="#81756F" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17">以时间随机玩法为例：Redis / Lua 校验令牌，RabbitMQ 异步处理记录</text>
  <g filter="url(#s)"><rect x="80" y="215" width="1120" height="550" rx="22" fill="#FFFEFC"/><path d="M102 215h1076a22 22 0 0 1 22 22v53H80v-53a22 22 0 0 1 22-22Z" fill="#FFF8F3"/><circle cx="112" cy="252" r="7" fill="#BE4942"/><text x="132" y="258" fill="#443633" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700">抽奖请求 · 服务端处理示意</text><text x="1155" y="258" text-anchor="end" fill="#96867F" font-family="Arial,sans-serif" font-size="12">HIGH-CONCURRENCY FLOW</text></g>
