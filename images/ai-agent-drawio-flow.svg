<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI Draw.io · 人与 AI 协作绘图流程</title>
  <desc id="desc">Next.js 前端经 HTTP 接口创建内存会话，需求分析、绘图、检查三个 Agent 顺序执行。返回 user 文本供补充需求，或返回 drawio XML 加载到画布。用户可手动编辑，并按需将当前图 XML 带入下一次请求。浏览器历史保存于 localStorage。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#72938f" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="1080" fill="#f5f8fa"/>
  <rect width="1440" height="184" fill="#13283a"/>
  <path d="M0 184H1440" stroke="#80e5c1" stroke-width="4"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="49" fill="#80e5c1" font-size="17" font-weight="650" letter-spacing="3">AI AGENT SCAFFOLD LITE / AI DRAW.IO</text>
    <text x="56" y="111" fill="#ffffff" font-size="44" font-weight="700">描述需求，生成图表，再一起修改</text>
    <text x="58" y="150" fill="#a9c0cd" font-size="21">对话生成与手动编辑，围绕同一份 Draw.io XML 继续协作。</text>

    <rect x="56" y="222" width="1328" height="126" rx="18" fill="#ffffff" stroke="#d8e2e9"/>
    <text x="82" y="262" fill="#5473b8" font-size="17" font-weight="700" letter-spacing="2">01 / NEXT.JS + TYPESCRIPT</text>
    <text x="82" y="309" fill="#20374b" font-size="25" font-weight="650">输入绘图需求 · 选择智能体</text>
    <path d="M500 290H553" fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="580" y="279" fill="#20374b" font-size="22" font-weight="650">HTTP API</text>
    <text x="580" y="313" fill="#60788a" font-size="18">智能体列表 / 创建会话 / 对话</text>
    <path d="M918 290H974" fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1004" y="279" fill="#20374b" font-size="22" font-weight="650">ChatService</text>
    <text x="1004" y="313" fill="#60788a" font-size="18">InMemoryRunner · 内存会话</text>
    <path d="M1190 348V385" fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="56" y="392" width="1328" height="234" rx="20" fill="#e9f6f0" stroke="#cae5db"/>
    <text x="82" y="434" fill="#2a8270" font-size="18" font-weight="700" letter-spacing="2">02 / 顺序工作流 · SEQUENTIAL_DRAW_PROCESS</text>
    <g fill="#ffffff" stroke="#cae5db">
      <rect x="82" y="462" width="368" height="126" rx="14"/>
      <rect x="536" y="462" width="368" height="126" rx="14"/>
      <rect x="990" y="462" width="368" height="126" rx="14"/>
    </g>
    <g fill="#235549" font-size="26" font-weight="650">
      <text x="106" y="505">需求分析 Agent</text><text x="560" y="505">绘图 Agent</text><text x="1014" y="505">检查 Agent</text>
    </g>
    <g fill="#607c75" font-size="19">
      <text x="106" y="544">理解需求 · 按需调用工具</text><text x="106" y="574">信息不足时提示用户补充</text>
      <text x="560" y="544">依据分析结果设计图表</text><text x="560" y="574">生成 Draw.io XML</text>
      <text x="1014" y="544">检查 XML 与连线布局</text><text x="1014" y="574">输出约定的 JSON 响应</text>
    </g>
    <g fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)">
      <path d="M450 525H531"/><path d="M904 525H985"/>
      <path d="M1174 626V665"/><path d="M1174 650H288V665"/>
    </g>

    <rect x="56" y="672" width="464" height="164" rx="18" fill="#fbf5e9" stroke="#ecdfc9"/>
    <text x="82" y="714" fill="#947348" font-size="18" font-weight="700">TYPE: USER</text>
    <text x="82" y="758" fill="#20374b" font-size="26" font-weight="650">在对话区补充信息</text>
    <text x="82" y="800" fill="#7e765f" font-size="19">继续澄清图表类型、节点与关系</text>

    <rect x="552" y="672" width="832" height="164" rx="18" fill="#ffffff" stroke="#d8e2e9"/>
    <text x="578" y="714" fill="#2a8270" font-size="18" font-weight="700">TYPE: DRAWIO</text>
    <text x="578" y="758" fill="#20374b" font-size="26" font-weight="650">XML 加载到 Draw.io 画布</text>
    <text x="578" y="800" fill="#60788a" font-size="19">手动调整节点与连线 · 自动保存当前图 · 导出 SVG</text>
    <path d="M1060 836V875" fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M56 936H28V290H51" fill="none" stroke="#72938f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <rect x="56" y="882" width="1328" height="108" rx="18" fill="#132f3d"/>
    <text x="82" y="924" fill="#b4f1dc" font-size="23" font-weight="650">03 / 按需携带当前图，继续对话修改</text>
    <text x="82" y="962" fill="#b0c9cc" font-size="20">当前画布 XML + 新需求 → 下一次对话；会话历史与画布在浏览器 localStorage 保存。</text>
    <text x="58" y="1038" fill="#708592" font-size="17">按仓库代码梳理的流程图；前端本地历史与后端内存会话分别维护。</text>
    <text x="1382" y="1038" text-anchor="end" fill="#8aa098" font-size="17">NEXT.JS / SPRING BOOT / GOOGLE ADK</text>
  </g>
</svg>
