<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">CampusAI 园区智能助手产品设计</title><desc id="desc">园区智能客服界面设计，展示社团报名咨询、业务工具调用和会话记忆。此图是基于项目功能重新设计的界面演示。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcebe8"/><stop offset=".6" stop-color="#e9f1f2"/><stop offset="1" stop-color="#c3d7e5"/></linearGradient><radialGradient id="glow"><stop stop-color="#a3edd5" stop-opacity=".19"/><stop offset="1" stop-color="#a3edd5" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163c43" flood-opacity=".1"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M2 2L7 5L2 8" fill="none" stroke="#0f5257" stroke-width="1.3"/></marker></defs><g font-family="Geist, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><g data-layer="base" data-at="0" data-style="none"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#102d31" stroke="none"/><ellipse cx="1300" cy="450" rx="650" ry="650" fill="url(#glow)"/><g transform="translate(64 56)"><rect x="0" y="0" width="42" height="42" rx="12.6" fill="#a3edd5" stroke="none"/><path d="M28.979999999999997 12.18H18.06Q10.92 12.18 10.92 20.58Q10.92 29.82 18.06 29.82H28.979999999999997" stroke="#102d31" stroke-width="2.9400000000000004" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29.4" cy="21.42" r="1.974" fill="#102d31"/></g><text x="122" y="87" font-size="28" fill="white" font-weight="500" >CampusAI</text><text x="1536" y="84" font-size="14" fill="#b2cbcd" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">PRODUCT &amp; INTERACTION DESIGN</text></g><g data-layer="headline" data-at="0.25" data-style="up"><text x="64" y="249" font-size="16" fill="#a3edd5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">AI FOR CAMPUS LIFE</text><text x="61" y="355" font-size="72" fill="white" font-weight="500" >园区服务，</text><text x="61" y="449" font-size="72" fill="white" font-weight="500" >对话即入口。</text><text x="65" y="514" font-size="25" fill="#c0d5d5" font-weight="400" >公告、资料与业务办理，</text><text x="65" y="553" font-size="25" fill="#c0d5d5" font-weight="400" >在同一个智能助手中完成。</text><rect x="64" y="607" width="112" height="34" rx="17" fill="#20484a" stroke="none"/><text x="120" y="630" font-size="15" fill="#a3edd5" font-weight="500" text-anchor="middle">Spring AI</text><rect x="188" y="607" width="72" height="34" rx="17" fill="#20484a" stroke="none"/><text x="224" y="630" font-size="15" fill="#a3edd5" font-weight="500" text-anchor="middle">RAG</text><rect x="272" y="607" width="126" height="34" rx="17" fill="#20484a" stroke="none"/><text x="335" y="630" font-size="15" fill="#a3edd5" font-weight="500" text-anchor="middle">Tool Calling</text></g><g data-layer="workspace" data-at="0.65" data-style="up"><rect x="628" y="192" width="908" height="620" rx="22" fill="#f8fbfa" stroke="none"/><rect x="628" y="192" width="205" height="620" rx="22" fill="#e8efed" stroke="none"/><rect x="812" y="192" width="21" height="620" rx="0" fill="#e8efed" stroke="none"/><path d="M833 192L833 812" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="657" y="236" font-size="15" fill="#5f7679" font-weight="500" >工作空间</text><rect x="647" y="261" width="166" height="43" rx="10" fill="#0f5257" stroke="none"/><g transform="translate(660 272) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4H21V17H10L5 21V17H3Z"/></g><text x="691" y="289" font-size="18" fill="white" font-weight="500" >智能客服</text><g transform="translate(661 326) scale(0.8333333333333334)" fill="none" stroke="#5f7679" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H15L20 7V22H6ZM14 2V8H20M9 12H17M9 16H16"/></g><text x="691" y="342" font-size="17" fill="#5f7679" font-weight="400" >文档问答</text><g transform="translate(661 376) scale(0.8333333333333334)" fill="none" stroke="#5f7679" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7L12 2L22 7L12 12ZM2 12L12 17L22 12M2 17L12 22L22 17"/></g><text x="691" y="392" font-size="17" fill="#5f7679" font-weight="400" >公告知识库</text><path d="M649 430L812 430" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="660" y="463" font-size="12" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">RECENT</text><text x="660" y="502" font-size="17" fill="#0f5257" font-weight="500" >社团报名咨询</text><text x="660" y="542" font-size="17" fill="#5f7679" font-weight="400" >园区公告查询</text><text x="660" y="582" font-size="17" fill="#5f7679" font-weight="400" >资料阅读与总结</text><g transform="translate(654 748)"><rect x="0" y="0" width="28" height="28" rx="8.4" fill="#0f5257" stroke="none"/><path d="M19.32 8.12H12.04Q7.28 8.12 7.28 13.719999999999999Q7.28 19.88 12.04 19.88H19.32" stroke="white" stroke-width="1.9600000000000002" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="19.599999999999998" cy="14.280000000000001" r="1.316" fill="#a3edd5"/></g><text x="695" y="768" font-size="17" fill="#0f5257" font-weight="500" >CampusAI</text><text x="865" y="235" font-size="20" fill="#152f33" font-weight="500" >园区智能助手</text><circle cx="1452" cy="228" r="4" fill="#23765f"/><text x="1466" y="235" font-size="14" fill="#5f7679" font-weight="400" >会话中</text><path d="M833 260L1536 260" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="866" y="784" font-size="12" fill="#5f7679" font-weight="400" >界面设计演示</text><rect x="866" y="714" width="639" height="47" rx="12" fill="white" stroke="#d6e2e2"/><text x="886" y="744" font-size="16" fill="#5f7679" font-weight="400" >继续提问，或描述你想办理的事情…</text><rect x="1458" y="721" width="32" height="32" rx="8" fill="#0f5257" stroke="none"/><g transform="translate(1464 727) scale(0.8333333333333334)" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12H20M14 6L20 12L14 18"/></g></g><g data-layer="question" data-at="1.35" data-style="up"><rect x="1016" y="289" width="484" height="52" rx="13" fill="#e2efea" stroke="none"/><text x="1038" y="322" font-size="18" fill="#152f33" font-weight="400" >我想了解社团报名，需要提交哪些信息？</text></g><g data-layer="answer" data-at="2.4" data-style="up"><g transform="translate(865 365)"><rect x="0" y="0" width="30" height="30" rx="9" fill="#0f5257" stroke="none"/><path d="M20.7 8.7H12.9Q7.800000000000001 8.7 7.800000000000001 14.7Q7.800000000000001 21.299999999999997 12.9 21.299999999999997H20.7" stroke="white" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="21" cy="15.3" r="1.41" fill="#a3edd5"/></g><text x="908" y="389" font-size="17" fill="#0f5257" font-weight="500" >CampusAI</text><text x="907" y="429" font-size="18" fill="#152f33" font-weight="400" >我可以协助你查询社团信息并完成报名。</text><text x="907" y="467" font-size="18" fill="#152f33" font-weight="400" >请告诉我你的姓名、意向社团和报名信息。</text><rect x="907" y="490" width="562" height="48" rx="10" fill="#edf4f1" stroke="none"/><g transform="translate(921 504) scale(0.8333333333333334)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4V8M16 4H20V8M4 16V20H8M20 16V20H16M9 9L6 12L9 15M15 9L18 12L15 15"/></g><text x="952" y="520" font-size="15" fill="#0f5257" font-weight="400" >工具调用 · 采集信息 → 执行业务 → 返回结果</text></g><g data-layer="memory" data-at="3.6" data-style="up"><rect x="907" y="558" width="562" height="105" rx="12" fill="white" stroke="#d6e2e2"/><g transform="translate(925 577) scale(0.8333333333333334)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6C3 1 21 1 21 6V18C21 23 3 23 3 18ZM3 6C3 11 21 11 21 6M3 12C3 17 21 17 21 12"/></g><text x="958" y="593" font-size="17" fill="#152f33" font-weight="500" >对话记忆</text><text x="928" y="633" font-size="16" fill="#5f7679" font-weight="400" >历史消息随会话保留，后续追问承接上下文。</text></g><g data-layer="bottom" data-at="0.9" data-style="up"><path d="M64 876L1536 876" stroke="#345357" stroke-width="1" fill="none" /><text x="64" y="922" font-size="16" fill="#c0d5d5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">01  智能对话</text><text x="432" y="922" font-size="16" fill="#c0d5d5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">02  业务工具</text><text x="800" y="922" font-size="16" fill="#c0d5d5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">03  知识检索</text><text x="1168" y="922" font-size="16" fill="#c0d5d5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">04  会话记忆</text></g></g></svg>
