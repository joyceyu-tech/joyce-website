<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">CampusAI · Tool Calling 业务闭环</title><desc id="desc">用户请求携带会话上下文，Spring AI 构造提示词与工具定义，模型判断工具与参数，由应用执行业务工具，回填实际执行结果后生成回答。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcebe8"/><stop offset=".6" stop-color="#e9f1f2"/><stop offset="1" stop-color="#c3d7e5"/></linearGradient><radialGradient id="glow"><stop stop-color="#a3edd5" stop-opacity=".19"/><stop offset="1" stop-color="#a3edd5" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163c43" flood-opacity=".1"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M2 2L7 5L2 8" fill="none" stroke="#0f5257" stroke-width="1.3"/></marker></defs><g font-family="Geist, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><g data-layer="background" data-at="0" data-style="none"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#edf3f3" stroke="none"/><rect x="0" y="0" width="1600" height="208" rx="0" fill="#102d31" stroke="none"/><g transform="translate(58 35)"><rect x="0" y="0" width="34" height="34" rx="10.2" fill="#a3edd5" stroke="none"/><path d="M23.459999999999997 9.86H14.62Q8.84 9.86 8.84 16.66Q8.84 24.14 14.62 24.14H23.459999999999997" stroke="#102d31" stroke-width="2.3800000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="23.799999999999997" cy="17.34" r="1.598" fill="#102d31"/></g><text x="108" y="59" font-size="17" fill="#a3edd5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">CAMPUSAI / TOOL CALLING</text><text x="58" y="124" font-size="43" fill="white" font-weight="500" >从一句话，到一次业务执行。</text><text x="60" y="172" font-size="21" fill="#b2cbcd" font-weight="400" >模型负责判断意图，Spring AI 应用执行工具，再将结果交还给模型组织回答。</text><text x="1540" y="62" font-size="15" fill="#a3bfc1" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">02 / SYSTEM DESIGN</text><path d="M58 941L1542 941" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="58" y="973" font-size="14" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">JOYCE YU  /  CAMPUSAI</text><text x="1542" y="973" font-size="14" fill="#5f7679" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">SPRING AI · RAG · TOOL CALLING</text></g><g data-layer="request" data-at="0.3" data-style="up"><rect x="58" y="242" width="1484" height="88" rx="18" fill="white" stroke="#d6e2e2"/><g transform="translate(85 270) scale(1.125)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4H21V17H10L5 21V17H3Z"/></g><text x="138" y="272" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">USER REQUEST</text><text x="138" y="309" font-size="24" fill="#152f33" font-weight="500" >“我想报名社团，可以帮我登记吗？”</text><rect x="1314" y="268" width="198" height="34" rx="17" fill="#e6f2ee" stroke="none"/><text x="1413" y="291" font-size="15" fill="#0f5257" font-weight="500" text-anchor="middle">自然语言输入</text></g><g data-layer="lanes" data-at="0.6" data-style="up"><rect x="58" y="364" width="344" height="48" rx="12" fill="#dde9e7" stroke="none"/><text x="230" y="395" font-size="20" fill="#0f5257" font-weight="500" text-anchor="middle">用户与会话</text><rect x="438" y="364" width="344" height="48" rx="12" fill="#0f5257" stroke="none"/><text x="610" y="395" font-size="20" fill="white" font-weight="500" text-anchor="middle">Spring AI 应用</text><rect x="818" y="364" width="344" height="48" rx="12" fill="#dde9e7" stroke="none"/><text x="990" y="395" font-size="20" fill="#0f5257" font-weight="500" text-anchor="middle">大语言模型</text><rect x="1198" y="364" width="344" height="48" rx="12" fill="#dde9e7" stroke="none"/><text x="1370" y="395" font-size="20" fill="#0f5257" font-weight="500" text-anchor="middle">业务工具</text></g><g data-layer="prompt" data-at="1" data-style="up"><rect x="58" y="456" width="344" height="166" rx="18" fill="white" stroke="#d6e2e2"/><rect x="80" y="478" width="40" height="40" rx="12" fill="#edf5f2" stroke="none"/><g transform="translate(88 486) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4H21V17H10L5 21V17H3Z"/></g><text x="134" y="496" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">01 · INPUT</text><text x="80" y="556" font-size="25" fill="#152f33" font-weight="500" >带入会话上下文</text><text x="80" y="589" font-size="17" fill="#5f7679" font-weight="400" >自然语言 + 历史消息</text><rect x="438" y="456" width="344" height="166" rx="18" fill="white" stroke="#d6e2e2"/><rect x="460" y="478" width="40" height="40" rx="12" fill="#edf5f2" stroke="none"/><g transform="translate(468 486) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7L12 2L22 7L12 12ZM2 12L12 17L22 12M2 17L12 22L22 17"/></g><text x="514" y="496" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">02 · PREPARE</text><text x="460" y="556" font-size="25" fill="#152f33" font-weight="500" >构造模型请求</text><text x="460" y="589" font-size="17" fill="#5f7679" font-weight="400" >系统提示词 + 工具定义</text></g><g data-layer="intent" data-at="1.8" data-style="up"><path d="M402 539L438 539" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M782 539L818 539" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="818" y="456" width="344" height="166" rx="18" fill="white" stroke="#d6e2e2"/><rect x="840" y="478" width="40" height="40" rx="12" fill="#edf5f2" stroke="none"/><g transform="translate(848 486) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z"/></g><text x="894" y="496" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">03 · DECIDE</text><text x="840" y="556" font-size="25" fill="#152f33" font-weight="500" >判断意图与参数</text><text x="840" y="589" font-size="17" fill="#5f7679" font-weight="400" >返回工具名称与调用参数</text><path d="M1162 539L1198 539" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1198" y="456" width="344" height="166" rx="18" fill="#102d31" stroke="#102d31"/><rect x="1220" y="478" width="40" height="40" rx="12" fill="#21454a" stroke="none"/><g transform="translate(1228 486) scale(1)" fill="none" stroke="#a3edd5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4H4V8M16 4H20V8M4 16V20H8M20 16V20H16M9 9L6 12L9 15M15 9L18 12L15 15"/></g><text x="1274" y="496" font-size="13" fill="#acd4cc" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">04 · EXECUTE</text><text x="1220" y="556" font-size="25" fill="white" font-weight="500" >应用执行业务工具</text><text x="1220" y="589" font-size="17" fill="#b9d1d0" font-weight="400" >采集信息 / 调用业务 / 写库</text></g><g data-layer="return" data-at="2.8" data-style="up"><path d="M1370 622V694H990V654" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1123" y="677" width="158" height="34" rx="17" fill="#e6f2ee" stroke="none"/><text x="1202" y="700" font-size="15" fill="#0f5257" font-weight="500" text-anchor="middle">业务结果回填</text><path d="M990 622V654" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="818" y="654" width="344" height="46" rx="12" fill="#e1efea" stroke="none"/><text x="990" y="684" font-size="18" fill="#0f5257" font-weight="500" text-anchor="middle">模型接收工具执行结果</text><path d="M818 676H610V715" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g><g data-layer="complete" data-at="3.4" data-style="up"><rect x="58" y="734" width="714" height="147" rx="18" fill="#102d31" stroke="none"/><g transform="translate(84 760)"><rect x="0" y="0" width="34" height="34" rx="10.2" fill="#a3edd5" stroke="none"/><path d="M23.459999999999997 9.86H14.62Q8.84 9.86 8.84 16.66Q8.84 24.14 14.62 24.14H23.459999999999997" stroke="#102d31" stroke-width="2.3800000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="23.799999999999997" cy="17.34" r="1.598" fill="#102d31"/></g><text x="136" y="785" font-size="24" fill="white" font-weight="500" >05 · 生成自然语言答复</text><text x="88" y="833" font-size="20" fill="#c1d8d6" font-weight="400" >将实际业务结果返回用户，并更新当前会话上下文。</text><path d="M610 715V734" stroke="#0f5257" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="818" y="734" width="724" height="147" rx="18" fill="white" stroke="#d6e2e2"/><text x="846" y="772" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">EXECUTION BOUNDARY</text><text x="846" y="814" font-size="23" fill="#152f33" font-weight="500" >工具由应用调用，模型只提出调用请求。</text><text x="846" y="852" font-size="18" fill="#5f7679" font-weight="400" >信息采集、业务入库与上下文更新形成完整闭环。</text></g></g></svg>
