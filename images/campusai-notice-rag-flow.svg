<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">CampusAI · 公告与资料 RAG 检索链路</title><desc id="desc">上方为内容维护、MySQL 持久化、RabbitMQ 变更通知、索引变更处理（新增更新编码、删除移除）、Redis Stack 索引；下方为用户问题、Spring AI 检索、Redis Stack 知识召回、模型生成与回答用户。</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcebe8"/><stop offset=".6" stop-color="#e9f1f2"/><stop offset="1" stop-color="#c3d7e5"/></linearGradient><radialGradient id="glow"><stop stop-color="#a3edd5" stop-opacity=".19"/><stop offset="1" stop-color="#a3edd5" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163c43" flood-opacity=".1"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M2 2L7 5L2 8" fill="none" stroke="#0f5257" stroke-width="1.3"/></marker></defs><g font-family="Geist, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"><g data-layer="background" data-at="0" data-style="none"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#edf3f3" stroke="none"/><rect x="0" y="0" width="1600" height="208" rx="0" fill="#102d31" stroke="none"/><g transform="translate(58 35)"><rect x="0" y="0" width="34" height="34" rx="10.2" fill="#a3edd5" stroke="none"/><path d="M23.459999999999997 9.86H14.62Q8.84 9.86 8.84 16.66Q8.84 24.14 14.62 24.14H23.459999999999997" stroke="#102d31" stroke-width="2.3800000000000003" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="23.799999999999997" cy="17.34" r="1.598" fill="#102d31"/></g><text x="108" y="59" font-size="17" fill="#a3edd5" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">CAMPUSAI / KNOWLEDGE LIFECYCLE</text><text x="58" y="124" font-size="43" fill="white" font-weight="500" >让每一次检索，找到相关知识。</text><text x="60" y="172" font-size="21" fill="#b2cbcd" font-weight="400" >公告维护进入异步索引链路；用户提问通过语义检索，为模型补充相关内容。</text><text x="1540" y="62" font-size="15" fill="#a3bfc1" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">03 / SYSTEM DESIGN</text><path d="M58 941L1542 941" stroke="#d6e2e2" stroke-width="1" fill="none" /><text x="58" y="973" font-size="14" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">JOYCE YU  /  CAMPUSAI</text><text x="1542" y="973" font-size="14" fill="#5f7679" font-weight="400" text-anchor="end" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">SPRING AI · RAG · TOOL CALLING</text></g><g data-layer="indexLabel" data-at="0.3" data-style="up"><text x="58" y="260" font-size="15" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">A / KNOWLEDGE INDEXING</text><text x="58" y="301" font-size="27" fill="#152f33" font-weight="500" >公告与资料的知识化</text><rect x="1350" y="267" width="192" height="34" rx="17" fill="#e6f2ee" stroke="none"/><text x="1446" y="290" font-size="15" fill="#0f5257" font-weight="500" text-anchor="middle">异步索引链路</text></g><g data-layer="content" data-at="0.7" data-style="up"><rect x="58" y="335" width="268" height="164" rx="18" fill="white" stroke="#d6e2e2"/><rect x="80" y="357" width="40" height="40" rx="12" fill="#edf5f2" stroke="none"/><g transform="translate(88 365) scale(1)" fill="none" stroke="#0f5257" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H15L20 7V22H6ZM14 2V8H20M9 12H17M9 16H16"/></g><text x="134" y="375" font-size="13" fill="#5f7679" font-weight="400" font-family="SFMono-Regular, Menlo, monospace" letter-spacing="1">01 · MANAGE</text><text x="80" y="435" font-size="25" fill="#152f33" font-weight="500" >内容维护</text><text x="80" y="468" font-size="17" fill="#5f7679" font-weight="400" >管理端新增 / 修改 / 删除</text><path d="M326 418L362 418" stroke="#0f5257