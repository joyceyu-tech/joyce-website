<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Scaffold Lite · DDD 六模块架构</title>
  <desc id="desc">六个 Maven 模块的职责分区。App 负责启动装配，API 定义契约，Trigger 预留入口，Domain 实现 Agent 装配与编排，Infrastructure 预留持久化适配，Types 提供通用类型。</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9e3e9"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#72938f" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="1080" fill="#f5f8fa"/>
  <rect y="184" width="1440" height="896" fill="url(#dots)"/>
  <rect width="1440" height="184" fill="#13283a"/>
  <path d="M0 184H1440" stroke="#80e5c1" stroke-width="4"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="49" fill="#80e5c1" font-size="17" font-weight="650" letter-spacing="3">AI AGENT SCAFFOLD LITE / SYSTEM DESIGN</text>
    <text x="56" y="111" fill="#ffffff" font-size="44" font-weight="700">DDD 六模块架构</text>
    <text x="58" y="150" fill="#a9c0cd" font-size="21">以领域为核心，让启动配置、业务编排与外部适配各司其职。</text>

    <rect x="56" y="222" width="1328" height="108" rx="18" fill="#edf2fc" stroke="#cbd7ee"/>
    <rect x="76" y="242" width="68" height="68" rx="15" fill="#dce5f9"/>
    <text x="110" y="284" text-anchor="middle" fill="#4b64a0" font-size="23" font-weight="700">APP</text>
    <text x="167" y="265" fill="#20374b" font-size="26" font-weight="700">应用启动与装配</text>
    <text x="167" y="299" fill="#587084" font-size="19">Spring Boot 启动 · 配置绑定 · 线程池 · Maven 打包</text>
    <text x="1357" y="265" text-anchor="end" fill="#5b73a5" font-size="21" font-weight="600">ApplicationReadyEvent</text>
    <text x="1357" y="299" text-anchor="end" fill="#70869b" font-size="18">AiAgentAutoConfig → ArmoryService</text>
    <path d="M720 331V367" fill="none" stroke="#72938f" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="56" y="374" width="300" height="242" rx="18" fill="#ffffff" stroke="#d8e2e9"/>
    <text x="80" y="413" fill="#5473b8" font-size="17" font-weight="700" letter-spacing="2">API / 接口契约</text>
    <text x="80" y="457" fill="#20374b" font-size="28" font-weight="700">对外契约定义</text>
    <text x="80" y="496" fill="#60788a" font-size="20">DTO · Response&lt;T&gt;</text>
    <path d="M80 521H332" stroke="#e4ebf0"/>
    <text x="80" y="555" fill="#60788a" font-size="18">统一返回结构</text>
    <text x="80" y="583" fill="#60788a" font-size="18">为调用方定义数据边界</text>

    <rect x="56" y="638" width="300" height="224" rx="18" fill="#ffffff" stroke="#d8e2e9" stroke-dasharray="7 5"/>
    <text x="80" y="677" fill="#5473b8" font-size="17" font-weight="700" letter-spacing="2">TRIGGER / 触发入口</text>
    <text x="80" y="721" fill="#20374b" font-size="28" font-weight="700">业务入口扩展</text>
    <text x="80" y="761" fill="#60788a" font-size="20">HTTP · Job · Listener</text>
    <rect x="80" y="791" width="154" height="36" rx="18" fill="#f0f3f7"/>
    <text x="157" y="815" text-anchor="middle" fill="#6c8192" font-size="17">已预留包结构</text>

    <rect x="390" y="374" width="636" height="488" rx="20" fill="#ffffff" stroke="#6ebfa9" stroke-width="2"/>
    <rect x="391" y="375" width="634" height="90" rx="19" fill="#e9f6f0"/>
    <rect x="391" y="440" width="634" height="25" fill="#e9f6f0"/>
    <text x="418" y="412" fill="#2a8270" font-size="17" font-weight="700" letter-spacing="2">DOMAIN / 领域核心</text>
    <text x="418" y="447" fill="#173e3a" font-size="27" font-weight="700">Agent 装配与工作流编排</text>
    <rect x="418" y="490" width="580" height="76" rx="12" fill="#132f3d"/>
    <text x="440" y="522" fill="#c2f1df" font-size="23" font-weight="650">ArmoryService + DefaultArmoryFactory</text>
    <text x="440" y="550" fill="#a1c3ca" font-size="18">策略树驱动装配 · DynamicContext 共享上下文</text>
    <rect x="418" y="586" width="278" height="99" rx="12" fill="#f1f7f5"/>
    <text x="438" y="622" fill="#235549" font-size="22" font-weight="650">Model + MCP</text>
    <text x="438" y="654" fill="#607c75" font-size="18">Spring AI · 工具回调挂载</text>
    <rect x="716" y="586" width="282" height="99" rx="12" fill="#f1f7f5"/>
    <text x="736" y="622" fill="#235549" font-size="22" font-weight="650">LlmAgent</text>
    <text x="736" y="654" fill="#607c75" font-size="18">Google ADK · 角色与指令</text>
    <rect x="418" y="705" width="580" height="66" rx="12" fill="#f0f3fc"/>
    <text x="708" y="746" text-anchor="middle" fill="#4c64a0" font-size="22" font-weight="600">Sequential / Parallel / Loop → Runner</text>
    <text x="418" y="814" fill="#6b8290" font-size="18">领域模型：Entity · Value Object · Aggregate 包结构</text>

    <rect x="1060" y="374" width="324" height="488" rx="18" fill="#ffffff" stroke="#d8e2e9" stroke-dasharray="7 5"/>
    <text x="1084" y="413" fill="#a07840" font-size="17" font-weight="700" letter-spacing="1">INFRASTRUCTURE</text>
    <text x="1084" y="457" fill="#20374b" font-size="28" font-weight="700">基础设施适配</text>
    <text x="1084" y="495" fill="#60788a" font-size="20">外部依赖与持久化边界</text>
    <rect x="1084" y="523" width="276" height="65" rx="10" fill="#faf5ec"/>
    <text x="1104" y="563" fill="#8b6d44" font-size="20">Adapter / Repository</text>
    <rect x="1084" y="604" width="276" height="65" rx="10" fill="#faf5ec"/>
    <text x="1104" y="644" fill="#8b6d44" font-size="20">DAO / PO · Gateway</text>
    <rect x="1084" y="685" width="276" height="65" rx="10" fill="#faf5ec"/>
    <text x="1104" y="725" fill="#8b6d44" font-size="20">MyBatis / MySQL / Redis</text>
    <text x="1084" y="800" fill="#6c8192" font-size="18">已预留包结构与依赖配置</text>
    <text x="1084" y="829" fill="#6c8192" font-size="18">按具体业务补充适配实现</text>

    <rect x="56" y="894" width="1328" height="94" rx="18" fill="#eef2f5" stroke="#d7e1e7"/>
    <text x="80" y="934" fill="#4e677a" font-size="17" font-weight="700" letter-spacing="2">TYPES / 通用支撑</text>
    <text x="80" y="966" fill="#263f51" font-size="23" font-weight="600">AppException · ResponseCode · Constants</text>
    <text x="1357" y="952" text-anchor="end" fill="#6d8291" font-size="20">统一异常、响应码与常量</text>
    <text x="58" y="1039" fill="#708592" font-size="17">模块职责视图，非 Maven 依赖图；虚线框表示仍以扩展骨架为主的模块。</text>
    <text x="1382" y="1039" text-anchor="end" fill="#8aa098" font-size="17" letter-spacing="1">JAVA 17 / SPRING BOOT 3</text>
  </g>
</svg>
