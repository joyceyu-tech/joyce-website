<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Scaffold Lite · 配置装配与三种 Agent 协作模式</title>
  <desc id="desc">配置经 Root、AiApi、ChatModel、Agent、AgentWorkflow、Runner 节点装配，MCP 工具挂载到模型。下方展示顺序代码协作、并行调研汇总、循环审稿优化示例。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#759591" stroke-width="1.5"/></marker>
    <marker id="purpleArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8793ba" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="1120" fill="#f5f8fa"/>
  <rect width="1440" height="184" fill="#13283a"/>
  <path d="M0 184H1440" stroke="#80e5c1" stroke-width="4"/>
