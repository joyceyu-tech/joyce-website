    <text x="1356" y="261" text-anchor="end" fill="#7b909c" font-size="18">ai.agent.config → RootNode</text>
    <g fill="none" stroke="#759591" stroke-width="2" marker-end="url(#arrow)">
      <path d="M290 346H337"/><path d="M546 346H593"/><path d="M802 346H849"/><path d="M1058 346H1105"/>
    </g>
